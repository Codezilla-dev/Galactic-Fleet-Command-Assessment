name: CI

on:
  pull_request:
  push:

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker checks
    runs-on: ubuntu-latest
    needs: node

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker test target
        run: docker build --target test -t fleet-command:test .

      - name: Build production Docker image
        run: docker build -t fleet-command:latest .
